name: Deploy — TDS Tecnologia 2027 → Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:          # permite disparar manualmente pelo GitHub

jobs:
  build-and-deploy:
    # Build no Windows para gerar o apphost/web.config corretos para o App Service Windows.
    runs-on: windows-latest
    name: Build .NET 8 e publica no Azure

    steps:
      # ── 1. Código-fonte ────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. SDK .NET 8 ──────────────────────────────────────────────────
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # ── 3. Restaurar dependências ──────────────────────────────────────
      - name: Restore
        run: dotnet restore src/TdsTecnologia2027.Web/TdsTecnologia2027.Web.csproj

      # ── 4. Publicar (Release, win-x64) ─────────────────────────────────
      - name: Publish
        run: dotnet publish src/TdsTecnologia2027.Web/TdsTecnologia2027.Web.csproj -c Release -r win-x64 --self-contained false -o ./publish

      # ── 5. Deploy → Azure App Service ─────────────────────────────────
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'tdstecnologia2027'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
